<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin – KathArmonya</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>
#main{max-width:1100px;margin:auto;padding-top:32px}.wide{max-width:1200px}.admin-card{width:min(94vw,560px);min-height:0;margin:24px auto;border-radius:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}.top h1{white-space:normal;font-size:clamp(1.6rem,4vw,2.4rem);color:#fff}.top .sub{margin:8px 0 0;text-align:left}.top button{margin:4px}.bar{display:flex;gap:12px;margin:16px 0}.grow{flex:1}.bar input{width:100%;font:inherit;border:1.5px solid #d8c7a3;border-radius:10px;padding:.75rem;background:#fffdf7}.tablewrap{overflow:auto;background:#c9d3df;border-radius:14px;padding:8px}table{border-collapse:collapse;width:100%;color:#172033}th,td{text-align:left;padding:12px;border-bottom:1px solid #b9c5d2;vertical-align:top}th{font-weight:700;color:#38213e}tbody tr:last-child td{border-bottom:0}.empty{text-align:center;padding:26px;color:#5C6881}.ghost{background:#c9d3df;color:#38213e;border-color:#b89545}.danger{background:#7d2632;border-color:#7d2632}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 12px}.tabs button[aria-pressed="true"]{background:#b89545;color:#24162b;border-color:#b89545}.count{font-weight:700}.rating-pill{display:inline-block;border-radius:99px;padding:4px 9px;background:#efe3c7;color:#38213e;font-weight:700;white-space:nowrap}.comments{min-width:220px;max-width:360px;white-space:pre-wrap;overflow-wrap:anywhere}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:600px){#main{padding-top:18px}.top>div:last-child{display:flex;flex-wrap:wrap}.bar{flex-direction:column}th,td{padding:9px}}
</style><link rel="stylesheet" href="polish.css"></head><body><main id="main">
<section id="loginView"><h1 style="color:#fff">Admin Sign In</h1><p class="sub">Only the organizer can view registrations and attendee feedback.</p><form class="card admin-card" id="loginForm"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="full" type="submit" id="loginBtn">Sign in</button><div id="loginMsg" class="msg err hidden" role="alert"></div></form></section>
<section id="dashView" class="hidden"><div class="top"><div><h1 id="title">Admin Dashboard</h1><p class="sub"><span id="count" class="count">0</span> <span id="countLabel">registrations</span></p></div><div><button class="ghost" id="refresh">Refresh</button><button class="ghost" id="export">Export CSV</button><button class="ghost" id="logout">Sign out</button></div></div>
<nav class="tabs" aria-label="Admin categories"><button id="registrationsTab" aria-pressed="true" type="button">Registrations</button><button id="feedbackTab" aria-pressed="false" type="button">Feedback</button></nav>
<div class="bar"><div class="grow"><input id="search" type="search" placeholder="Search name or number" aria-label="Search current category"></div></div>
<div id="registrationsPanel"><div class="tablewrap"><table><thead><tr><th>#</th><th>Name</th><th>Contact number</th><th>Registered</th><th><span class="sr">Actions</span></th></tr></thead><tbody id="rows"></tbody></table></div></div>
<div id="feedbackPanel" class="hidden"><div class="tablewrap"><table><thead><tr><th>#</th><th>Attendee</th><th>Overall</th><th>Program</th><th>Venue</th><th>Comments / suggestions</th><th>Submitted</th><th><span class="sr">Actions</span></th></tr></thead><tbody id="feedbackRows"></tbody></table></div></div><div id="dashMsg" class="msg err hidden" role="alert"></div></section>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
const C=window.APP_CONFIG,db=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY),$=id=>document.getElementById(id);let registrations=[],feedback=[],category='registrations';$('title').textContent=C.EVENT_NAME+' admin';function setView(s){$('loginView').classList.toggle('hidden',s);$('dashView').classList.toggle('hidden',!s);$('main').classList.toggle('wide',s)}function message(t){$('dashMsg').textContent=t;$('dashMsg').classList.remove('hidden')}function clearMessage(){$('dashMsg').classList.add('hidden')}
function setCategory(c){category=c;$('registrationsTab').setAttribute('aria-pressed',String(c==='registrations'));$('feedbackTab').setAttribute('aria-pressed',String(c==='feedback'));$('registrationsPanel').classList.toggle('hidden',c!=='registrations');$('feedbackPanel').classList.toggle('hidden',c!=='feedback');$('search').placeholder=c==='registrations'?'Search name or number':'Search attendee or comments';$('countLabel').textContent=c==='registrations'?'registrations':'feedback responses';render()}
async function load(){clearMessage();const [r,f]=await Promise.all([db.from('registrations').select('*').order('created_at',{ascending:false}),db.from('feedback').select('*').order('created_at',{ascending:false})]);if(r.error){message('Could not load registrations: '+r.error.message);return}registrations=r.data||[];if(f.error){feedback=[];message('Feedback could not be loaded. Run the feedback table SQL in schema.sql, then refresh. Details: '+f.error.message)}else feedback=f.data||[];render()}
function cell(tr,value,cls){const td=document.createElement('td');td.textContent=value??'';if(cls)td.className=cls;tr.append(td);return td}function render(){const q=$('search').value.trim().toLowerCase();if(category==='registrations'){const list=registrations.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.contact_number||'').includes(q));$('count').textContent=registrations.length;const body=$('rows');body.replaceChildren();if(!list.length){const tr=document.createElement('tr');cell(tr,registrations.length?'No matches.':'No registrations yet.','empty').colSpan=5;body.append(tr);return}list.forEach((r,i)=>{const tr=document.createElement('tr');[list.length-i,r.name,r.contact_number,new Date(r.created_at).toLocaleString()].forEach(v=>cell(tr,v));const td=document.createElement('td'),b=document.createElement('button');b.className='danger';b.textContent='Delete';b.onclick=async()=>{if(!confirm('Delete registration for '+r.name+'?'))return;const {error}=await db.from('registrations').delete().eq('id',r.id);if(error)alert('Delete failed: '+error.message);else load()};td.append(b);tr.append(td);body.append(tr)})}else{const list=feedback.filter(r=>[r.attendee_name,r.comments].some(v=>(v||'').toLowerCase().includes(q)));$('count').textContent=feedback.length;const body=$('feedbackRows');body.replaceChildren();if(!list.length){const tr=document.createElement('tr');cell(tr,feedback.length?'No matches.':'No feedback has been submitted yet.','empty').colSpan=8;body.append(tr);return}list.forEach((r,i)=>{const tr=document.createElement('tr');cell(tr,list.length-i);cell(tr,r.attendee_name||'Anonymous');cell(tr,'★ '+r.overall_rating,'rating-pill');cell(tr,r.program_rating? r.program_rating+'/5':'—');cell(tr,r.venue_rating?r.venue_rating+'/5':'—');cell(tr,r.comments||'—','comments');cell(tr,new Date(r.created_at).toLocaleString());const td=document.createElement('td'),b=document.createElement('button');b.className='danger';b.textContent='Delete';b.onclick=async()=>{if(!confirm('Delete this feedback response?'))return;const {error}=await db.from('feedback').delete().eq('id',r.id);if(error)alert('Delete failed: '+error.message);else load()};td.append(b);tr.append(td);body.append(tr)})}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginBtn').disabled=false;if(error){$('loginMsg').textContent='Sign in failed. Check your email and password.';$('loginMsg').classList.remove('hidden');return}$('loginMsg').classList.add('hidden');setView(true);load()});$('logout').onclick=async()=>{await db.auth.signOut();setView(false)};$('refresh').onclick=load;$('search').oninput=render;$('registrationsTab').onclick=()=>setCategory('registrations');$('feedbackTab').onclick=()=>setCategory('feedback');$('export').onclick=()=>{const rows=category==='registrations'?registrations.map(r=>[r.name,r.contact_number,r.created_at]):feedback.map(r=>[r.attendee_name,r.overall_rating,r.program_rating,r.venue_rating,r.comments,r.created_at]);const headers=category==='registrations'?['Name','Contact number','Registered']:['Attendee','Overall rating','Program rating','Venue rating','Comments','Submitted'];const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const csv=[headers.map(esc).join(','),...rows.map(r=>r.map(esc).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=category+'.csv';a.click();URL.revokeObjectURL(a.href)};db.auth.getSession().then(({data})=>{if(data.session){setView(true);load()}});
</script></body></html>
