<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KathArmonya – Event Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css">
<style>
.feedback-intro{color:#f5eaf7;text-align:center;margin:.35rem auto 0;max-width:640px;line-height:1.5}.feedback-card{width:min(92vw,680px);min-height:0;margin:28px auto 0;border-radius:20px;padding:clamp(22px,4vw,38px)}.feedback-card h2{font-family:Cinzel,Georgia,serif;color:#38213e;margin:0 0 8px;font-size:1.35rem}.feedback-card .lead{color:#5C6881;margin:0 0 22px}.feedback-card textarea,.feedback-card select{width:100%;font:inherit;color:var(--ink);background:#fffdf7;border:1.5px solid #d8c7a3;border-radius:10px;padding:.75rem .85rem;margin-bottom:1.1rem}.feedback-card textarea{min-height:115px;resize:vertical}.rating-group{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:8px 0 22px}.rating-option{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:54px;border:1.5px solid #b89545;border-radius:12px;padding:10px 8px;background:#fffdf7;color:#38213e;cursor:pointer;text-align:center;transition:background .15s,border-color .15s,box-shadow .15s}.rating-option input{accent-color:#4b2853;appearance:auto;width:18px;height:18px;flex:0 0 18px;margin:0;cursor:pointer}.rating-option strong{font-size:.95rem;line-height:1.2}.rating-option span{font-size:.95rem;line-height:1.2;overflow-wrap:anywhere}.rating-option:has(input:checked){background:#f3ead7;border-color:#7b5a25;box-shadow:0 0 0 2px #b8954540}.rating-option:focus-within{outline:3px solid #b89545;outline-offset:2px}.page-links{text-align:center;margin:18px auto;color:#fff}.page-links a{color:#fff;text-decoration:underline;text-underline-offset:3px}.feedback-logo{height:min(18vh,240px);width:min(34vw,290px)}
@media(max-width:600px){.feedback-card{width:min(92vw,680px)}.feedback-logo{height:min(18vh,220px)}.rating-group{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.rating-option{justify-content:flex-start;min-height:48px;padding:10px 12px}.rating-option span{font-size:.95rem}}
@media(min-width:601px) and (max-width:900px){.rating-group{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:360px){.rating-group{grid-template-columns:1fr 1fr}.rating-option{gap:7px;padding:9px}.rating-option span{font-size:.9rem}}
</style><link rel="stylesheet" href="polish.css">
</head>
<body><div class="stage-art" aria-hidden="true"><img class="curtain curtain-left" src="media/BackgroundEraser_20261019_002654072.png" alt=""><img class="curtain curtain-right" src="media/BackgroundEraser_20261019_002654072.png" alt=""></div>
<main><header class="brand"><img class="logo feedback-logo" src="media/BackgroundEraser_20261019_002037837.png" alt="KathArmonya logo"><h1 id="eventName">KATHARMONYA</h1><p class="feedback-intro">Thank you for joining us! Share your experience and help us make future events even better.</p></header>
<form class="card feedback-card" id="feedbackForm"><h2>Event Feedback</h2><p class="lead">Your feedback is valuable to our organizers. Fields marked required must be completed.</p>
<label for="attendeeName">Name <span class="opt">(optional)</span></label><input id="attendeeName" type="text" maxlength="100" autocomplete="name" placeholder="Your name">
<label>Overall event experience <span aria-hidden="true">*</span></label><div class="rating-group" role="radiogroup" aria-label="Overall event experience"> <label class="rating-option"><input type="radio" name="overall_rating" value="1" required><strong>1</strong><span>Poor</span></label><label class="rating-option"><input type="radio" name="overall_rating" value="2"><strong>2</strong><span>Fair</span></label><label class="rating-option"><input type="radio" name="overall_rating" value="3"><strong>3</strong><span>Good</span></label><label class="rating-option"><input type="radio" name="overall_rating" value="4"><strong>4</strong><span>Great</span></label><label class="rating-option"><input type="radio" name="overall_rating" value="5"><strong>5</strong><span>Excellent</span></label></div>
<label for="programRating">Program and activities</label><select id="programRating"><option value="">Choose a rating (optional)</option><option value="1">1 – Poor</option><option value="2">2 – Fair</option><option value="3">3 – Good</option><option value="4">4 – Great</option><option value="5">5 – Excellent</option></select>
<label for="venueRating">Venue and organization</label><select id="venueRating"><option value="">Choose a rating (optional)</option><option value="1">1 – Poor</option><option value="2">2 – Fair</option><option value="3">3 – Good</option><option value="4">4 – Great</option><option value="5">5 – Excellent</option></select>
<label for="comments">Comments or suggestions <span class="opt">(optional)</span></label><textarea id="comments" maxlength="3000" placeholder="What did you enjoy? What could we improve?"></textarea>
<button class="full" id="feedbackSubmit" type="submit">Send Feedback</button><div id="feedbackMsg" class="msg hidden" role="status" aria-live="polite"></div>
</form><p class="page-links"><a href="index.html">Back to registration</a><a href="admin.html">Admin</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="config.js"></script><script>
const C=window.APP_CONFIG;document.title=C.EVENT_NAME+' – Feedback';document.getElementById('eventName').textContent=C.EVENT_NAME;const db=supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);const form=document.getElementById('feedbackForm'),msg=document.getElementById('feedbackMsg'),btn=document.getElementById('feedbackSubmit');function show(t,c){msg.textContent=t;msg.className='msg '+c;}
form.addEventListener('submit',async e=>{e.preventDefault();const rating=Number(new FormData(form).get('overall_rating'));if(!(rating>=1&&rating<=5))return show('Please select an overall event rating.','err');btn.disabled=true;btn.textContent='Sending…';const payload={attendee_name:document.getElementById('attendeeName').value.trim()||null,overall_rating:rating,program_rating:document.getElementById('programRating').value?Number(document.getElementById('programRating').value):null,venue_rating:document.getElementById('venueRating').value?Number(document.getElementById('venueRating').value):null,comments:document.getElementById('comments').value.trim()||null};const {error}=await db.from('feedback').insert(payload);btn.disabled=false;btn.textContent='Send Feedback';if(error){console.error(error);return show('We could not send your feedback. Please try again in a moment.','err');}form.reset();show('Thank you! Your feedback has been submitted.','ok');});
</script></body></html>
